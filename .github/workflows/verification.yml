name: verification

# The one definition of "verified", called by ci.yml (every push and PR) and by
# release.yml (before any image is built), so a release can never check less than a PR.
on: workflow_call
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: proxiapay_test }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env: { TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/proxiapay_test }
      - run: npm run build -w apps/console
      # The deploy script is what ships a release; its tests are part of "verified".
      - run: shellcheck ops/release/*.sh ops/db/*.sh ops/backup/*.sh
      - run: bash ops/release/test-release-scripts.sh
      - run: npm audit --omit=dev --audit-level=high
