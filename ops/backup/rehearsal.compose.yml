# The rehearsal's additions to the production stack, used by ops/backup/rehearse.sh
# only: MinIO standing in for R2, and `restore`, the scratch database a backup is
# restored into. Never layered on a real stack.
services:
  # MinIO as packaged by Bitnami: minio/minio is no longer published on Docker
  # Hub or quay.io. This archived tag is pinned and creates the bucket itself.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: pay-db-backups
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [internal]

  # The production db image with the production owner file, on a volume of its
  # own, started without archiving: a restored server must never ship WAL into
  # the bucket it was restored from.
  restore:
    image: ${REGISTRY:-ghcr.io/iamvaln}/proxiapay-db:${IMAGE_TAG:-latest}
    env_file: ${OWNER_ENV_FILE}
    volumes:
      - restore-scratch:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [internal]

volumes:
  restore-scratch:
