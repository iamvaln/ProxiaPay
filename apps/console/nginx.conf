# The console is a single-page application: every path that is not a real file
# must return index.html, or a refresh on /transactions answers 404 while the
# same URL reached by clicking works. The API's own prefixes never arrive here —
# Traefik routes /v1, /console, /providers and /docs to the api container first.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite writes content-hashed filenames, so the bundle is immutable by
  # construction and index.html is the only thing that must never be cached.
  location /assets/ {
    # One header, not two: `expires` emits its own Cache-Control, and combined
    # with add_header nginx sends both — legal, but the pair is a puzzle to read
    # in a response and the weaker of the two is what some caches obey.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
