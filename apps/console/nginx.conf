# The console is a single-page application: every path that is not a real file
# must return index.html, or a refresh on /transactions answers 404 while the
# same URL reached by clicking works. The API's own prefixes never arrive here —
# Traefik routes /v1, /console, /providers and /docs to the api container first.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite writes content-hashed filenames, so the bundle is immutable by
  # construction and index.html is the only thing that must never be cached.
  location /assets/ {
    # One header, not two: `expires` emits its own Cache-Control, and combined
    # with add_header nginx sends both — legal, but the pair is a puzzle to read
    # in a response and the weaker of the two is what some caches obey.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The api's prefixes are claimed by Traefik and never arrive here. If one does (a router
  # missing, the api down), a 503 says so; try_files would answer 200 with index.html, which
  # a health check reads as "up".
  location ~ ^/(v1|console|providers|docs|healthz)(/|$) {
    default_type text/plain;
    return 503 "api route not served\n";
  }

  # The payment page belongs to the paylink listener, under its CSP; here it would be a
  # file like any other.
  location = /pay.html {
    return 404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}

# The payment page's own listener. A separate port rather than a header Traefik sets: Traefik
# reaches it only through the -paylink service, so nothing arriving on the console host can
# select this block by forging a header, and nothing here can serve the console.
#
# PAYER TOKENS TRAVEL IN URL PATHS (/pay-api/v1/payments/<token>/…), though those never reach
# this container (Traefik sends /pay-api to the api). The page's own paths carry a link code.
# The access log is off for both: a code in a log is a code anyone with the log can use.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  access_log off;

  # nginx drops every inherited add_header the moment a location adds one of its own, so the
  # security headers are repeated in each location that sets Cache-Control. A test checks it.
  # font-src 'self': the page's fonts are self-hosted by Vite. No inline script or style.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The platform's prefixes are not this host's: 404, not the page.
  location ~ ^/(v1|console|providers|docs|healthz|pay-api)(/|$) {
    default_type text/plain;
    return 404 "not found\n";
  }

  location ~ ^/(favicon\.svg|favicon-32\.png|apple-touch-icon\.png)$ {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Every other path is the payment page; the router in the browser reads the code.
  location / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /pay.html =404;
  }
}
